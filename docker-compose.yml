services:
  db:
    image: postgres:17-alpine
    container_name: streakarena-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: streak
      POSTGRES_PASSWORD: streak
      POSTGRES_DB: streakarena
    ports:
      # Host-only, so the database isn't reachable from the internet.
      - "127.0.0.1:5433:5432"
    volumes:
      - streakarena-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streak -d streakarena"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: streakarena-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://streak:streak@db:5432/streakarena
      # Falls back to a dev-only secret so `docker compose up` works out of the box.
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-before-you-use-this-for-real}
      # This deployment is plain http://, and a secure cookie would be dropped.
      COOKIE_SECURE: "false"
      PORT: 4000
    ports:
      - "8080:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  streakarena-data:
