name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  # A second push shouldn't race the first one's service update.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: streakarena-prod
  ECS_CLUSTER: streakarena-prod
  ECS_SERVICE: streakarena-prod
  TASK_FAMILY: streakarena-prod

permissions:
  contents: read
  id-token: write # Required for OIDC; there are no AWS keys in this repository.

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # The build runs tsc first, so this is the whole quality gate the repo has.
      - name: Build the bundle
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: frontend/dist
          retention-days: 1

  deploy:
    name: Ship it
    needs: check
    # Opt-in, so the pipeline doesn't fail on every push before the infra exists.
    # Set the repository variable DEPLOY_ENABLED=true once `terraform apply` has run
    # and AWS_DEPLOY_ROLE is set. Until then this job is skipped, not failed.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tagged with the commit so a rollback is "deploy that other tag", not a rebuild.
      - name: Build and push the API image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker build -t "$IMAGE" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Point a new task definition at that image
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task.json
          jq --arg img "$IMAGE" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' task.json > new-task.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://new-task.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "TASK_ARN=$ARN" >> "$GITHUB_ENV"

      # Migrations run before the new code serves traffic, as their own task. Prisma
      # migrations here are additive, so the old revision keeps working meanwhile.
      - name: Run database migrations
        run: |
          SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=streakarena-prod-public-*" \
            --query 'Subnets[].SubnetId' --output text | tr '\t' ',')
          SG=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=streakarena-prod-api" \
            --query 'SecurityGroups[0].GroupId' --output text)

          TASK=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["npx","prisma","migrate","deploy"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK"

          CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$CODE" != "0" ]; then
            echo "Migrations exited $CODE — not deploying. Check /ecs/streakarena-prod."
            exit 1
          fi

      - name: Roll the service
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$TASK_ARN" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist

      # Fingerprinted assets first and immutable; index.html last and never cached, so
      # a half-finished sync can't serve an index pointing at assets that aren't up yet.
      - name: Publish the bundle
        run: |
          BUCKET=$(aws s3api list-buckets \
            --query "Buckets[?starts_with(Name,'streakarena-prod-site')].Name | [0]" --output text)
          aws s3 sync dist "s3://$BUCKET" --delete \
            --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate the edge
        run: |
          DIST=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='streakarena-prod'].Id | [0]" --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/index.html' >/dev/null
